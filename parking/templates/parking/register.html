
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | ParkGrid</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f7f9fc;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 950px;
            min-height: 580px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        }

        .left {
            width: 42%;
            background: #2474ff;
            color: white;
            padding: 55px 45px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .logo {
            font-size: 30px;
            font-weight: 800;
            margin-bottom: 45px;
        }

        .logo span {
            color: #dce9ff;
        }

        .left h1 {
            font-size: 38px;
            line-height: 1.15;
            margin-bottom: 20px;
        }

        .left p {
            font-size: 15px;
            line-height: 1.7;
            color: #e5edff;
        }

        .right {
            width: 58%;
            padding: 45px 55px;
        }

        .right h2 {
            font-size: 30px;
            color: #172033;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #7a8495;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .message {
            padding: 11px 14px;
            border-radius: 8px;
            margin-bottom: 18px;
            background: #fff1f1;
            color: #d32f2f;
            font-size: 13px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;
            height: 46px;
            border: 1px solid #dce1e8;
            border-radius: 8px;
            padding: 0 13px;
            font-size: 14px;
            outline: none;
            background: white;
        }

        input:focus,
        select:focus {
            border-color: #2474ff;
        }

        .register-button {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 8px;
            background: #2474ff;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }

        .register-button:hover {
            background: #1764e8;
        }

        .login-text {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #687386;
        }

        .login-text a {
            color: #2474ff;
            text-decoration: none;
            font-weight: 600;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

        @media (max-width: 800px) {
            .container {
                width: 95%;
            }

            .left {
                display: none;
            }

            .right {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="left">

            <div class="logo">
                Park<span>Grid</span>
            </div>

            <h1>
                Your parking journey starts here.
            </h1>

            <p>
                Create your ParkGrid account and enjoy
                smarter, faster and hassle-free parking.
            </p>

        </div>


        <div class="right">

            <h2>Create Account</h2>

            <p class="subtitle">
                Join ParkGrid today
            </p>


            {% if messages %}
                {% for message in messages %}
                    <div class="message">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}


            <form method="POST">

                {% csrf_token %}

                <div class="form-group">

                    <label for="full_name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="full_name"
                        name="full_name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="role">
                        Account Type
                    </label>

                    <select
                        id="role"
                        name="role"
                        required
                    >

                        <option value="">
                            Select account type
                        </option>

                        <option value="user">
                            User
                        </option>

                        <option value="manager">
                            Parking Manager
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirm_password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="register-button"
                >
                    Create Account
                </button>

            </form>


            <p class="login-text">

                Already have an account?

                <a href="{% url 'login' %}">
                    Login
                </a>

            </p>

        </div>

    </div>

</body>
</html>
